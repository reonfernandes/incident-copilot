name: incident-copilot

services:
    postgres:
        image: pgvector/pgvector:pg18
        container_name: ic-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-incident_copilot}
            POSTGRES_USER: ${POSTGRES_USER:-copilot}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
        ports:
            -   "5432:5432"
        volumes:
            -   pg_data:/var/lib/postgresql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        container_name: ic-redis
        restart: unless-stopped
        ports:
            -   "6379:6379"
        volumes:
            -   cache_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

    kafka:
        image: apache/kafka:4.2.1
        container_name: ic-kafka
        restart: unless-stopped
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
        ports:
            -   "9092:9092"
        healthcheck:
            test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s

    ollama:
        image: ollama/ollama:latest
        container_name: ic-ollama
        restart: unless-stopped
        profiles:
            -   "ai"
        environment:
            OLLAMA_MAX_LOADED_MODELS: 1
            OLLAMA_NUM_PARALLEL: 1
            OLLAMA_KEEP_ALIVE: 5m
        ports:
            -   "127.0.0.1:11434:11434"
        volumes:
            -   ollama_data:/root/.ollama
        healthcheck:
            test: [ "CMD", "ollama", "list" ]
            interval: 15s
            timeout: 10s
            retries: 5

volumes:
    pg_data:
    cache_data:
    ollama_data:
